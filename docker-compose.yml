services:
  # LIVE API — do not use for restructuring. Promote from api_dev when stable.
  farmos:
    build: ./api
    container_name: farmos-backend
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 api.asgi:application
      "
    environment:
      - DEBUG=${DEBUG:-True}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - LOCAL_PORT=8000
      - LOCAL_DB_NAME=${DB_NAME}
      - LOCAL_USERNAME=${DB_USER}
      - LOCAL_HOSTNAME=${DB_HOST}
      - LOCAL_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=farmos_db
      - DB_PORT=5432
    depends_on:
      - farmos_db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app_network
    volumes:
      - ./api:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  # DEV API — all new backend work happens in ./api_dev until promoted to ./api.
  farmos_dev:
    build: ./api_dev
    container_name: farmos-dev-backend
    command: >
      sh -c "
      python manage.py migrate --noinput || true
      python manage.py collectstatic --noinput &&
      python manage.py run_due_schedules || true &&
      daphne -b 0.0.0.0 -p 8000 api.asgi:application
      "
    environment:
      - DEBUG=${DEBUG:-True}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_NAME=farmos_dev
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=farmos_dev_db
      - DB_PORT=5432
    depends_on:
      farmos_dev_db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - app_network
    volumes:
      - ./api_dev:/app
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    restart: on-failure

  farmos_db:
    image: postgres:15
    container_name: farmos-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - farmos_data:/var/lib/postgresql/data
    networks:
      - app_network

  farmos_dev_db:
    image: postgres:15
    container_name: farmos-dev-db
    environment:
      - POSTGRES_DB=farmos_dev
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - farmos_dev_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d farmos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: farmos-redis
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_farmos
    depends_on:
      - farmos
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - app_network

  nginx_dev:
    image: nginx:alpine
    container_name: nginx_farmos_dev
    depends_on:
      - farmos_dev
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - static_volume_dev:/app/dev/staticfiles
      - media_volume_dev:/app/dev/media
    networks:
      - app_network

volumes:
  farmos_data:
  farmos_dev_data:
  static_volume:
  media_volume:
  static_volume_dev:
  media_volume_dev:

networks:
  app_network:
    driver: bridge
